<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles.css">

    <title>GPT 2.0</title>
</head>

<body>

    <header>
        <h1>GPT 2.0</h1>
    </header>


    <main>

        <!-- BARRA LATERAL -->
        <aside id="ichats">

            <!-- PERSONA -->
            <div id="persona">

                <div class="persona-photo">
                    <img src="./chat/persona.jpeg" alt="Era pra ter uma imagem aqui">
                </div>

                <h2>Mática</h2>

                <p>
                    Assistente virtual especializada em fornecer soluções eficientes para problemas do dia a dia
                </p>

            </div>


            <!-- CONVERSAS -->
            <div class="chat-list">

                <h3>Conversas</h3>

                <button class="chat-item">
                    Nova conversa
                </button>

                <button class="chat-item">
                    Aprendendo JavaScript
                </button>

                <button class="chat-item">
                    Projeto GPT 2.0
                </button>

            </div>

        </aside>


        <!-- ÁREA PRINCIPAL DO CHAT -->
        <section id="chat">

            <div id="iresponses">
                <!-- As mensagens aparecerão aqui -->
            </div>


            <!-- INPUT -->
            <div id="iuserinput">

                <input
                    type="text"
                    placeholder="Digite sua mensagem..."
                >

                <button>
                    ENVIAR
                </button>

            </div>

        </section>

    </main>


    <footer>
        Todos os direitos reservados
    </footer>


    <script src="./script.js"></script>

</body>

</html>
